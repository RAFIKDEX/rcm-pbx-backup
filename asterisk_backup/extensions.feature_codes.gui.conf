; Feature Codes Dialplan Generated by RCM

[rcm-feature-codes]
exten => *999,1,Answer()
 same => n,VoiceMailMain(${CALLERID(num)}@default)
 same => n,Hangup()

exten => *98,1,Answer()
 same => n,VoiceMailMain()
 same => n,Hangup()

exten => _*58X.,1,Set(DB(FORWARD/BUSY/${CALLERID(num)})=${EXTEN:3})
 same => n,Progress()
 same => n,SayDigits(${CALLERID(num)})
 same => n,Playback(forward_busy_to)
 same => n,SayDigits(${EXTEN:3})
 same => n,Hangup()

exten => *59,1,DBdeltree(FORWARD/BUSY/${CALLERID(num)})
 same => n,Progress()
 same => n,SayDigits(${CALLERID(num)})
 same => n,Playback(rcm/media/forward_busy_deactivated)
 same => n,Hangup()

exten => _*60X.,1,Set(DB(FORWARD/NOANSWER/${CALLERID(num)})=${EXTEN:3})
 same => n,Progress()
 same => n,SayDigits(${CALLERID(num)})
 same => n,Playback(forward_no_answer_to)
 same => n,SayDigits(${EXTEN:3})
 same => n,Hangup()

exten => *61,1,DBdeltree(FORWARD/NOANSWER/${CALLERID(num)})
 same => n,Progress()
 same => n,SayDigits(${CALLERID(num)})
 same => n,Playback(rcm/media/forward_no_answer_deactivated)
 same => n,Hangup()

exten => _*64X.,1,Set(DB(FORWARD/ALWAYS/${CALLERID(num)})=${EXTEN:3})
 same => n,Progress()
 same => n,SayDigits(${CALLERID(num)})
 same => n,Playback(forward_always_to)
 same => n,SayDigits(${EXTEN:3})
 same => n,Hangup()

exten => *65,1,DBdeltree(FORWARD/ALWAYS/${CALLERID(num)})
 same => n,Progress()
 same => n,SayDigits(${CALLERID(num)})
 same => n,Playback(rcm/media/forward_always_deactivated)
 same => n,Hangup()

exten => *37,1,Set(DB(DND/${CALLERID(num)})=on)
 same => n,Playback(do-not-disturb)
 same => n,Hangup()

exten => *38,1,Set(DB(DND/${CALLERID(num)})=off)
 same => n,Playback(de-activated)
 same => n,Hangup()

exten => *8,1,Pickup()
 same => n,Hangup()

exten => _**X.,1,Pickup(${EXTEN:2})
 same => n,Hangup()

exten => _*54X.,1,Answer()
 same => n,Set(SPY_MODE=Spy)
 same => n,Set(TARGET=${FILTER(0-9,${EXTEN:3})})
 same => n,Set(SPY_CALLER=${CHANNEL(endpoint)})
 same => n,ExecIf($["${SPY_CALLER}"=""]?Set(SPY_CALLER=${CALLERID(num)}))
 same => n,Set(SPY_DENY_REASON=invalid_target)
 same => n,GotoIf($["${TARGET}"=""]?spy_denied)
 same => n,Set(SPY_DENY_REASON=invalid_caller)
 same => n,GotoIf($["${SPY_CALLER}"=""]?spy_denied)
 same => n,Set(SPY_DENY_REASON=self_spy)
 same => n,GotoIf($["${SPY_CALLER}"="${TARGET}"]?spy_denied)
 same => n,Set(SPY_DENY_REASON=target_not_found)
 same => n,GotoIf($[${DIALPLAN_EXISTS(internal,${TARGET},1)}=0]?spy_denied)
 same => n,Set(TARGET_STATE=${DEVICE_STATE(PJSIP/${TARGET})})
 same => n,Set(SPY_DENY_REASON=target_not_in_call)
 same => n,GotoIf($["${TARGET_STATE}"!="INUSE" & "${TARGET_STATE}"!="BUSY" & "${TARGET_STATE}"!="RINGINUSE"]?spy_denied)
 same => n,Set(SPY_DENY_REASON=no_permission)
 same => n,GotoIf($[${DB_EXISTS(SPY/PERMIT/${TARGET}-${SPY_CALLER})}=0]?spy_denied)
 same => n,Set(SPY_DENY_REASON=spy_denied)
 same => n,GotoIf($["${DB(SPY/DENY/${TARGET})}"="1"]?spy_denied)
 same => n,Playback(now_you_can_spy_to)
 same => n,SayDigits(${TARGET})
 same => n,System(/usr/bin/python3 /root/RCM_7021/scripts/log_spy_attempt.py "${SPY_CALLER}" "${TARGET}" "Spy" "allowed" "ok")
 same => n,ChanSpy(PJSIP/${TARGET},qE)
 same => n,Hangup()
 same => n(spy_denied),System(/usr/bin/python3 /root/RCM_7021/scripts/log_spy_attempt.py "${SPY_CALLER}" "${TARGET}" "${SPY_MODE}" "denied" "${SPY_DENY_REASON}")
 same => n,Playback(sorry-cant-let-you-do-that)
 same => n,Hangup()

