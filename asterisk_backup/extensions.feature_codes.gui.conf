 same => n,Playback(now_you_can_Whisper_to)
 same => n,SayDigits(${TARGET})
 same => n,System(/usr/bin/python3 /root/RCM_7021/scripts/log_spy_attempt.py "${SPY_CALLER}" "${TARGET}" "Whisper" "allowed" "ok")
 same => n,ChanSpy(PJSIP/${TARGET},qwE)
 same => n,Hangup()
 same => n(spy_denied),System(/usr/bin/python3 /root/RCM_7021/scripts/log_spy_attempt.py "${SPY_CALLER}" "${TARGET}" "${SPY_MODE}" "denied" "${SPY_DENY_REASON}")
