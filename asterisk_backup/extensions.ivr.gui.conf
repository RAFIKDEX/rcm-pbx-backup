; IVR Dialplan Generated by RCM

[rcm-ivr-routes]
exten => 7001,1,Goto(ivr-7001,7001,1)
exten => 7002,1,Goto(ivr-7002,7002,1)

; --- IVR GUI: main menu ---
[ivr-7001]
exten => 7001,1,Answer()
 same => n,Set(__RCM_IVR_NUM=7001)
 same => n,Set(__RCM_IVR_NAME=main menu)
 same => n,Set(__RCM_IVR_DIGIT=)
 same => n,Set(__RCM_IVR_DEST_TYPE=)
 same => n,Set(__RCM_IVR_DEST=)
 same => n,Set(__RCM_CALL_PATH=${RCM_CALL_PATH}~IVR:7001:main menu)
 same => n,Set(CDR(userfield)=${RCM_CALL_PATH})
 same => n,Set(CALLERID(name)=main menu)
 same => n,Set(TIMEOUT(digit)=3)
 same => n,Mset(test=1,cuc=1)
 same => n(start),Background(rcm/media/welcome2)
 same => n,WaitExten(10)

exten => 1,1,Set(__RCM_IVR_DIGIT=1)
 same => n,Set(__RCM_IVR_DEST_TYPE=ivr)
 same => n,Set(__RCM_IVR_DEST=7001)
 same => n,Set(__RCM_CALL_PATH=${RCM_CALL_PATH}~DIGIT:1~DEST:ivr:7001)
 same => n,Set(CDR(userfield)=${RCM_CALL_PATH})
 same => n,Goto(ivr-7001,7001,1)
exten => 2,1,Set(__RCM_IVR_DIGIT=2)
 same => n,Set(__RCM_IVR_DEST_TYPE=queue)
 same => n,Set(__RCM_IVR_DEST=6501)
 same => n,Set(__RCM_CALL_PATH=${RCM_CALL_PATH}~DIGIT:2~DEST:queue:6501)
 same => n,Set(CDR(userfield)=${RCM_CALL_PATH})
 same => n,Goto(queue-6501,6501,1)
exten => 753,1,Set(__RCM_IVR_DIGIT=753)
 same => n,Set(__RCM_IVR_DEST_TYPE=extension)
 same => n,Set(__RCM_IVR_DEST=2121)
 same => n,Set(__RCM_CALL_PATH=${RCM_CALL_PATH}~DIGIT:753~DEST:extension:2121)
 same => n,Set(CDR(userfield)=${RCM_CALL_PATH})
 same => n,Goto(internal,2121,1)
include => internal

exten => i,1,Set(test=$[${test} + 1])
 same => n,Playback(rcm/media/Sorry_you_pressed_an_invalid_key)
 same => n,GotoIf($[${test} < 4]?7001,start)
 same => n,Playback(goodbye)
 same => n,Hangup()
exten => t,1,Set(cuc=$[${cuc} + 1])
 same => n,Playback(rcm/media/Sorry_you_didnt_press_any_key)
 same => n,GotoIf($[${cuc} < 4]?7001,start)
 same => n,Playback(goodbye)
 same => n,Hangup()

