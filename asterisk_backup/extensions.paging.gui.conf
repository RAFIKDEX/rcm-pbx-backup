[rcm-paging-intercom]
; test
exten => 3698,1,NoOp(RCM Paging for test)
 same => n,Set(__RCM_CALL_PATH=${RCM_CALL_PATH}~PAGING:3698:test)
 same => n,Set(CDR(userfield)=${RCM_CALL_PATH})
 same => n,GotoIf($["2121"="${CALLERID(num)}"]?allow)
 same => n,Hangup()
 same => n(allow),NoOp(Caller allowed)
 same => n,GotoIf($["${RECORD_${CALLERID(num)}}"="out" | "${RECORD_${CALLERID(num)}}"="all"]?rcm_page_record)
 same => n,GotoIf($["${RECORD_5001}"="in" | "${RECORD_5001}"="all"]?rcm_page_record)
 same => n,Goto(rcm_page_record_continue)
 same => n(rcm_page_record),Set(CALLFILENAME=paging-3698-${CALLERID(num)}-${STRFTIME(${EPOCH},,%Y%m%d-%H%M%S)})
 same => n,Gosub(rcm-recording,start,1)
 same => n(rcm_page_record_continue),NoOp(RCM paging recording policy checked)
 same => n,Page(PJSIP/5001,A(rcm/media/welcome2))
 same => n,Hangup()

