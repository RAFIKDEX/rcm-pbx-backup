; --- Office Time Subroutines ---
[rcm-check-office-evening]
exten => s,1,Return(0)

[rcm-check-office-morning]
exten => s,1,GotoIfTime(04:00-09:00,sun,*,*?matched)
 same => n,GotoIfTime(08:00-17:00,mon,*,*?matched)
 same => n,GotoIfTime(08:00-17:00,tue,*,*?matched)
 same => n,Return(0)
 same => n(matched),Return(1)

[rcm-check-office-split]
exten => s,1,GotoIfTime(09:00-13:00,sun,*,*?matched)
 same => n,GotoIfTime(14:00-18:00,sun,*,*?matched)
 same => n,Return(0)
 same => n(matched),Return(1)

; --- Holiday Subroutines ---
[rcm-check-holiday-ramadan_holiday_id]
exten => s,1,GotoIf($[ ${EPOCH} >= 1772316000 && ${EPOCH} <= 1775080799 ]?matched)
 same => n,Return(0)
 same => n(matched),Return(1)

; --- Main Entry Point ---
[from-trunk]
exten => _X.,1,Set(__RCM_INBOUND_DID=${EXTEN})
 same => n,Set(__RCM_INBOUND_TRUNK=${CHANNEL(endpoint)})
 same => n,Goto(inbound-route-start,s,1)
exten => _+X.,1,Set(__RCM_INBOUND_DID=${EXTEN})
 same => n,Set(__RCM_INBOUND_TRUNK=${CHANNEL(endpoint)})
 same => n,Goto(inbound-route-start,s,1)
exten => _*X.,1,Set(__RCM_INBOUND_DID=${EXTEN})
 same => n,Set(__RCM_INBOUND_TRUNK=${CHANNEL(endpoint)})
 same => n,Goto(inbound-route-start,s,1)
exten => s,1,Set(__RCM_INBOUND_DID=${EXTEN})
 same => n,Set(__RCM_INBOUND_TRUNK=${CHANNEL(endpoint)})
 same => n,Goto(inbound-route-start,s,1)
exten => i,1,Set(__RCM_INBOUND_DID=${EXTEN})
 same => n,Set(__RCM_INBOUND_TRUNK=${CHANNEL(endpoint)})
 same => n,Goto(inbound-route-start,i,1)
exten => t,1,Set(__RCM_INBOUND_DID=${EXTEN})
 same => n,Set(__RCM_INBOUND_TRUNK=${CHANNEL(endpoint)})
 same => n,Goto(inbound-route-start,t,1)
exten => h,1,Set(__RCM_INBOUND_DID=${EXTEN})
 same => n,Set(__RCM_INBOUND_TRUNK=${CHANNEL(endpoint)})
 same => n,Goto(inbound-route-start,h,1)

[inbound-route-start]
exten => _X.,1,ExecIf($[ "${RCM_INBOUND_DID}" = "" ]?Set(__RCM_INBOUND_DID=${EXTEN}))
 same => n,Goto(inbound-route-eval,s,1)
exten => _+X.,1,ExecIf($[ "${RCM_INBOUND_DID}" = "" ]?Set(__RCM_INBOUND_DID=${EXTEN}))
 same => n,Goto(inbound-route-eval,s,1)
exten => _*X.,1,ExecIf($[ "${RCM_INBOUND_DID}" = "" ]?Set(__RCM_INBOUND_DID=${EXTEN}))
 same => n,Goto(inbound-route-eval,s,1)
exten => _[0-9a-zA-Z].,1,ExecIf($[ "${RCM_INBOUND_DID}" = "" ]?Set(__RCM_INBOUND_DID=${EXTEN}))
 same => n,Goto(inbound-route-eval,s,1)
exten => s,1,ExecIf($[ "${RCM_INBOUND_DID}" = "" ]?Set(__RCM_INBOUND_DID=${EXTEN}))
 same => n,Goto(inbound-route-eval,s,1)
exten => i,1,ExecIf($[ "${RCM_INBOUND_DID}" = "" ]?Set(__RCM_INBOUND_DID=${EXTEN}))
 same => n,Goto(inbound-route-eval,s,1)
exten => t,1,ExecIf($[ "${RCM_INBOUND_DID}" = "" ]?Set(__RCM_INBOUND_DID=${EXTEN}))
 same => n,Goto(inbound-route-eval,s,1)
exten => h,1,ExecIf($[ "${RCM_INBOUND_DID}" = "" ]?Set(__RCM_INBOUND_DID=${EXTEN}))
 same => n,Goto(inbound-route-eval,s,1)

[inbound-route-eval]
exten => s,1,NoOp(Inbound call evaluation started)
 same => n,Set(DID=${RCM_INBOUND_DID})
 same => n,ExecIf($[ "${DID}" = "" ]?Set(DID=${EXTEN}))
 same => n,Set(CID=${CALLERID(num)})
 same => n,Set(CID_NORM=${FILTER(0-9,${CID})})
 same => n,Goto(cid_norm_done)
 same => n(cid_norm_done),NoOp(Normalized CID=${CID_NORM})
 same => n,Set(TRUNK=${RCM_INBOUND_TRUNK})
 same => n,ExecIf($[ "${TRUNK}" = "" ]?Set(TRUNK=${CHANNEL(endpoint)}))
 same => n,Set(__RCM_CALL_PATH=${RCM_CALL_PATH}~INBOUND:${TRUNK}:${DID})
 same => n,Set(CDR(userfield)=${RCM_CALL_PATH})
 same => n,Set(TRUNK_CTX=${RCM_INBOUND_CTX})
 same => n,ExecIf($[ "${TRUNK_CTX}" = "" ]?Set(TRUNK_CTX=${CHANNEL(context)}))
; Evaluate: in_ucm
 same => n,Set(ROUTE_MATCHED=0)
 same => n,GotoIf($[ "${TRUNK}" != "ucm1" && "${TRUNK_CTX}" != "from-pri" ]?skip_r_d75f7485)
 same => n,Gosub(rcm-check-route-d75f7485,check,1)
 same => n,GotoIf($[ "${ROUTE_MATCHED}" = "1" ]?rcm-route-d75f7485-matched,s,1)
 same => n(skip_r_d75f7485),NoOp(Skipped route in_ucm)
; Evaluate: Main Route
 same => n,Set(ROUTE_MATCHED=0)
 same => n,GotoIf($[ "${TRUNK}" != "GSM" && "${TRUNK_CTX}" != "from-pri" ]?skip_r_main_route_id)
 same => n,Gosub(rcm-check-route-main_route_id,check,1)
 same => n,GotoIf($[ "${ROUTE_MATCHED}" = "1" ]?rcm-route-main_route_id-matched,s,1)
 same => n(skip_r_main_route_id),NoOp(Skipped route Main Route)
; Evaluate: se
 same => n,Set(ROUTE_MATCHED=0)
 same => n,GotoIf($[ "${TRUNK}" != "6666" && "${TRUNK_CTX}" != "from-trunk" ]?skip_r_ebcda846)
 same => n,Goto(rcm-route-ebcda846-matched,s,1)
 same => n(skip_r_ebcda846),NoOp(Skipped route se)
; CID fallback: keep DID routes reachable when caller ID format is unexpected
 same => n,Set(ROUTE_MATCHED=0)
 same => n,GotoIf($[ "${TRUNK}" != "GSM" && "${TRUNK_CTX}" != "from-pri" ]?skip_r_main_route_id_cidfb)
 same => n,Gosub(rcm-check-route-main_route_id-didonly,check,1)
 same => n,GotoIf($[ "${ROUTE_MATCHED}" = "1" ]?rcm-route-main_route_id-matched,s,1)
 same => n(skip_r_main_route_id_cidfb),NoOp(Skipped CID fallback route Main Route)
 same => n,NoOp(No inbound route matched)
 same => n,GotoIf($[ ${REGEX("^[0-9]+$" ${DID})} && ${DIALPLAN_EXISTS(internal,${DID},1)} ]?internal,${DID},1)
 same => n,Playback(ss-noservice)
 same => n,Hangup()

