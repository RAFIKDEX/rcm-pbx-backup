[internal]
; Auto-generated hints for all PJSIP extensions (Old & New)
exten => _X.,hint,PJSIP/${EXTEN}
exten => 2222,1,Goto(dexter,${EXTEN},1)
exten => 2233,1,Goto(dexter,${EXTEN},1)
exten => 2211,1,Goto(dexter,${EXTEN},1) 
exten => 2200,1,Goto(dexter,${EXTEN},1)
exten => 2001,1,Goto(dexter,${EXTEN},1)
exten => 2002,1,Goto(dexter,${EXTEN},1)


include => code
include => rcm-queue-routes
include => rcm-ivr-routes
include => rcm-queue-features
include => rcm-internal-destinations




;===================================================


[dexter]
exten => _X.,1,Set(CALLFILENAME=${CALLERID(num)}-${EXTEN}-${STRFTIME(${EPOCH},,%Y%m%d-%H%M%S)})
  same => n,Set(UNAVAIL_MSG=This_extension_is_unavailable)
  same => n,Set(BUSY_MSG=This_extension_is_busy)
  same => n,Set(DND_MSG=This_extension_is_on_DND)
  same => n,Set(NOANS_MSG=This_extension_is_not_answering)
 
  same => n,GoToIf($["${RECORD_${CALLERID(num)}}" = "out" | "${RECORD_${CALLERID(num)}}" = "all"]?recording,${EXTEN},1)
  same => n,GoToIf($["${RECORD_${EXTEN}}" = "in" | "${RECORD_${EXTEN}}" = "all"]?recording,${EXTEN},1)
  
  ; Check Forward Always
  same => n,Set(FWD_ALWAYS=${DB(FORWARD/ALWAYS/${EXTEN})})
  same => n,GotoIf($["${FWD_ALWAYS}" != ""]?forward_always)

  same => n,GoToIf($["${DB(DND/${EXTEN})}" = "on" ]?dnd_handling)
  
  ; Case B: DND is off. Check device state:
  same => n,GotoIf($[ "${PJSIP_DIAL_CONTACTS(${EXTEN})}" = "" ]?check_fm_unavail)
  same => n,Set(DEVSTATE=${DEVICE_STATE(PJSIP/${EXTEN})})
  same => n,GotoIf($[ "${DEVSTATE}" = "INUSE" | "${DEVSTATE}" = "BUSY" | "${DEVSTATE}" = "RINGING" | "${DEVSTATE}" = "RINGINUSE" | "${DEVSTATE}" = "ONHOLD" ]?check_fm_busy)
  
  ; Available: Dial normally (T/t for Transfer, X/x/W/w for automixmon/automon recording toggle *1)
  same => n,Set(RT=${IF($["${RING_${EXTEN}}"=""]?60:${RING_${EXTEN}})})
  same => n,Dial(${PJSIP_DIAL_CONTACTS(${EXTEN})},${RT},TtHhXxWw)
  same => n,GotoIf($["${FM_${EXTEN}}" != "on"]?post_dial)
  same => n,FollowMe(${EXTEN},d)
  
  ; Check Dial Status post-dial:
  same => n(post_dial),GotoIf($["${DIALSTATUS}" = "BUSY"]?play_busy)
  same => n,GotoIf($["${DIALSTATUS}" = "CHANUNAVAIL" | "${DIALSTATUS}" = "CONGESTION"]?goto_unavail)
  same => n,GotoIf($["${DIALSTATUS}" = "NOANSWER"]?no_answer_handling)
  same => n,Hangup()
  same => n(check_fm_unavail),GotoIf($["${FM_${EXTEN}}" != "on"]?goto_unavail)
  same => n,FollowMe(${EXTEN},d)
  same => n,Goto(goto_unavail)
  same => n(check_fm_busy),GotoIf($["${FM_${EXTEN}}" != "on"]?play_busy)
  same => n,FollowMe(${EXTEN},d)
  same => n,Goto(play_busy)
 
  ; Forward Always destination
  same => n(forward_always),Set(CDR(userfield)=${CDR(userfield)}~FORWARD:${EXTEN}:always:${FWD_ALWAYS})
  same => n,Goto(from-internal-${EXTEN},${FWD_ALWAYS},1)

  ; DND handling
  same => n(dnd_handling),Playback(${DND_MSG})
  same => n,SayDigits(${EXTEN})
  same => n,GotoIf($["${TOLOWER(${VM_${EXTEN}})}" = "on"]?vm,${EXTEN},1)
  same => n,Hangup()
  
  ; Play busy recording (checks Forward Busy first)
  same => n(play_busy),Set(FWD_BUSY=${DB(FORWARD/BUSY/${EXTEN})})
  same => n,GotoIf($["${FWD_BUSY}" != ""]?forward_busy)
  same => n,Playback(${BUSY_MSG})
  same => n,SayDigits(${EXTEN})
  same => n,Hangup()

  ; Forward Busy destination
  same => n(forward_busy),Set(CDR(userfield)=${CDR(userfield)}~FORWARD:${EXTEN}:busy:${FWD_BUSY})
  same => n,Goto(from-internal-${EXTEN},${FWD_BUSY},1)
  
  ; Play unavailable recording / Check Forward/Voicemail
  same => n(goto_unavail),Goto(unavail-fallback,${EXTEN},1)
  
  ; No Answer handling
  same => n(no_answer_handling),Set(FWD_NOANSWER=${DB(FORWARD/NOANSWER/${EXTEN})})
  same => n,GotoIf($["${FWD_NOANSWER}" != ""]?forward_noanswer)
  same => n,Playback(${NOANS_MSG})
  same => n,SayDigits(${EXTEN})
  same => n,GotoIf($["${TOLOWER(${VM_${EXTEN}})}" = "on"]?vm,${EXTEN},1)
  same => n,Hangup()
  same => n(forward_noanswer),Set(CDR(userfield)=${CDR(userfield)}~FORWARD:${EXTEN}:noanswer:${FWD_NOANSWER})
  same => n,Goto(from-internal-${EXTEN},${FWD_NOANSWER},1)


;==========================QUEUE===================================


;========================OUT PRI==========================
[out-pri]
exten => _02X.,1,Set(CALLFILENAME=${CALLERID(num)}-${EXTEN}-${STRFTIME(${EPOCH},,%Y%m%d-%H%M%S)})
  same => n,Gosub(rcm-recording,start,1)
  same => n,Dial(PJSIP/${EXTEN}@feg4301,60,Tt)
  same => n,Hangup()

;===================================================
[out-gsm]
exten => _01X.,1,Set(CALLFILENAME=${CALLERID(num)}-${EXTEN}-${STRFTIME(${EPOCH},,%Y%m%d-%H%M%S)})
  same => n,Gosub(rcm-recording,start,1)
  same => n,Dial(PJSIP/${EXTEN}@fgx4508,60,Tt)
  same => n,Hangup()
