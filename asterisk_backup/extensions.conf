[out-all]
exten => _X.,1,Set(CALLFILENAME=${CALLERID(num)}-${EXTEN}-${STRFTIME(${EPOCH},,%Y%m%d-%H%M%S)})
 same => n,Authenticate(1327)
 ;same => n,Authenticate(${PIN})
 same => n,Gosub(rcm-recording,start,1)
 same => n,Dial(PJSIP/${EXTEN}@fgx4508,60,Tt) 
 same => n,Dial(PJSIP/${EXTEN}@feg4301,60,Tt) 
 same => n,Hangup()


;===================================================
[recording]
exten => _X.,1,Set(dex=$[0${dex} + 1])
  same => n,GotoIf($[${dex} > 15]?play_busy) 
  same => n,Set(CALLFILENAME=${CALLERID(num)}-${EXTEN}-${STRFTIME(${EPOCH},,%Y%m%d-%H%M%S)})
  same => n,Gosub(rcm-recording,start,1)
  same => n,Set(UNAVAIL_MSG=This_extension_is_unavailable)
  same => n,Set(BUSY_MSG=This_extension_is_busy)
  same => n,Set(DND_MSG=This_extension_is_on_DND)
  same => n,Set(NOANS_MSG=This_extension_is_not_answering)
  
  same => n,GoToIf($["${DB(DND/${EXTEN})}" = "on" ]?dnd_handling)
  
  ; Case B: DND is off. Check device state:
  same => n,GotoIf($[ "${PJSIP_DIAL_CONTACTS(${EXTEN})}" = "" ]?check_fm_unavail_rec)
  same => n,Set(DEVSTATE=${DEVICE_STATE(PJSIP/${EXTEN})})
  same => n,GotoIf($[ "${DEVSTATE}" = "INUSE" | "${DEVSTATE}" = "BUSY" | "${DEVSTATE}" = "RINGING" | "${DEVSTATE}" = "RINGINUSE" | "${DEVSTATE}" = "ONHOLD" ]?check_fm_busy_rec)
  
  ; Available: Dial normally
  same => n,Set(RT=${IF($["${RING_${EXTEN}}"=""]?60:${RING_${EXTEN}})})
  same => n,Dial(${PJSIP_DIAL_CONTACTS(${EXTEN})},${RT},TtHh)
  same => n,GotoIf($["${FM_${EXTEN}}" != "on"]?post_dial)
  same => n,FollowMe(${EXTEN},d)
  
  ; Check Dial Status post-dial:
  same => n(post_dial),GotoIf($["${DIALSTATUS}" = "BUSY"]?play_busy)
  same => n,GotoIf($["${DIALSTATUS}" = "CHANUNAVAIL" | "${DIALSTATUS}" = "CONGESTION"]?play_unavail)
  same => n,GotoIf($["${DIALSTATUS}" = "NOANSWER"]?no_answer_handling)
  same => n,Hangup()
  same => n(check_fm_unavail_rec),GotoIf($["${FM_${EXTEN}}" != "on"]?play_unavail)
  same => n,FollowMe(${EXTEN},d)
  same => n,Goto(play_unavail)
  same => n(check_fm_busy_rec),GotoIf($["${FM_${EXTEN}}" != "on"]?play_busy)
  same => n,FollowMe(${EXTEN},d)
  same => n,Goto(play_busy)

  ; DND handling
  same => n(dnd_handling),Playback(${DND_MSG})
  same => n,SayDigits(${EXTEN})
  same => n,GotoIf($["${TOLOWER(${VM_${EXTEN}})}" = "on"]?vm,${EXTEN},1)
  same => n,Hangup()
  
  ; Play busy recording
  same => n(play_busy),Playback(${BUSY_MSG})
  same => n,SayDigits(${EXTEN})
  same => n,Hangup()
  
  ; Play unavailable recording
  same => n(play_unavail),Playback(${UNAVAIL_MSG})
  same => n,SayDigits(${EXTEN})
  same => n,Hangup()
  
  ; No Answer handling
  same => n(no_answer_handling),Set(FWD_NOANSWER=${DB(FORWARD/NOANSWER/${EXTEN})})
  same => n,GotoIf($["${FWD_NOANSWER}" != ""]?forward_noanswer)
  same => n,Playback(${NOANS_MSG})
  same => n,SayDigits(${EXTEN})
  same => n,GotoIf($["${TOLOWER(${VM_${EXTEN}})}" = "on"]?vm,${EXTEN},1)
  same => n,Hangup()
  same => n(forward_noanswer),Set(CDR(userfield)=${CDR(userfield)}~FORWARD:${EXTEN}:noanswer:${FWD_NOANSWER})
  same => n,Goto(from-internal-${EXTEN},${FWD_NOANSWER},1)


;==================================================
[vm]
exten => _X.,1,Progress()
same => n,Voicemail(${EXTEN}@default,b)
same => n,Hangup()

;==================================================
[busy]
exten => _X.,1,Progress()
same => n,Playback(This_extension_is_busy,noanswer)
same => n,SayDigits(${EXTEN})
same => n,Hangup()
;==================================================

[noanswer]
exten => _X.,1,Progress()
same => n,playback(This_extension_is_not_answering,noanswer)
same => n,SayDigits(${EXTEN})
same => n,Hangup()

;===============================================
[unavailable]
exten => _X.,1,Progress()
same => n,playback(This_extension_is_unavailable,noanswer)
same => n,SayDigits(${EXTEN})
same => n,Hangup()

;==================================================

[forward-busy]
exten => _X.,1,Set(FWD_NUM_B=${DB(FORWARD/BUSY/${EXTEN})})
 same => n,GotoIf($["${FWD_NUM_B}"=""]?busy,${EXTEN},1)
 same => n,Set(CDR(userfield)=${CDR(userfield)}~FORWARD:${EXTEN}:busy:${FWD_NUM_B})
 same => n,Goto(from-internal-${EXTEN},${FWD_NUM_B},1)



;==================================================


 
[forward-noanswer]
exten => _X.,1,Set(FWD_NUM_N=${DB(FORWARD/NOANSWER/${EXTEN})})
 same => n,GotoIf($["${FWD_NUM_N}"=""]?noanswer,${EXTEN},1)
 same => n,Set(CDR(userfield)=${CDR(userfield)}~FORWARD:${EXTEN}:noanswer:${FWD_NUM_N})
 same => n,Goto(from-internal-${EXTEN},${FWD_NUM_N},1)


;==================================================


 
 
[forward-unavail]
exten => _X.,1,Set(FWD_NUM_u=${DB(FORWARD/UNAVAIL/${EXTEN})})
 same => n,GotoIf($["${FWD_NUM_u}"=""]?hangup_call)
 same => n,Set(CDR(userfield)=${CDR(userfield)}~FORWARD:${EXTEN}:unavailable:${FWD_NUM_u})
 same => n,Goto(from-internal-${EXTEN},${FWD_NUM_u},1)
 same => n(hangup_call),Hangup()
[unavail-fallback]
exten => _X.,1,NoOp(Extension ${EXTEN} is unavailable)
 same => n,Set(FWD_UNAVAIL=${DB(FORWARD/UNAVAIL/${EXTEN})})
 same => n,GotoIf($["${FWD_UNAVAIL}" != ""]?forward_unavail)
  same => n,Set(UNAVAIL_MSG=This_extension_is_unavailable)
 same => n,Playback(${UNAVAIL_MSG})
 same => n,SayDigits(${EXTEN})
 same => n,GotoIf($["${TOLOWER(${VM_${EXTEN}})}" = "on"]?vm,${EXTEN},1)
 same => n,Hangup()
 same => n(forward_unavail),Set(CDR(userfield)=${CDR(userfield)}~FORWARD:${EXTEN}:unavailable:${FWD_UNAVAIL})
 same => n,Goto(from-internal-${EXTEN},${FWD_UNAVAIL},1)


