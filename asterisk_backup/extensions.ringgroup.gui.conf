; Ring Groups Dialplan Generated by RCM

[rcm-ring-groups]
exten => 6400,1,Answer()
 same => n,Playback(rcm/media/yyyy)
 same => n,NoOp(RCM-RG id=6400 name=support strategy=ringall)
 same => n,Set(__RCM_CALL_PATH=${RCM_CALL_PATH}~RINGGROUP:6400:support)
 same => n,Set(CDR(userfield)=${RCM_CALL_PATH})
 same => n,GotoIf($["${RECORD_${CALLERID(num)}}"="out" | "${RECORD_${CALLERID(num)}}"="all"]?rcm_rg_record)
 same => n,GotoIf($["${RECORD_5001}"="in" | "${RECORD_5001}"="all"]?rcm_rg_record)
 same => n,GotoIf($["${RECORD_5002}"="in" | "${RECORD_5002}"="all"]?rcm_rg_record)
 same => n,GotoIf($["${RECORD_2121}"="in" | "${RECORD_2121}"="all"]?rcm_rg_record)
 same => n,Goto(rcm_rg_record_continue)
 same => n(rcm_rg_record),Set(CALLFILENAME=ringgroup-6400-${CALLERID(num)}-${STRFTIME(${EPOCH},,%Y%m%d-%H%M%S)})
 same => n,Gosub(rcm-recording,start,1)
 same => n(rcm_rg_record_continue),NoOp(RCM ring group recording policy checked)
 same => n,Dial(PJSIP/5001&PJSIP/5002&PJSIP/2121,20,Tt)
 same => n,Hangup()
