; Queue Dialplan Generated by RCM

[globals](+)
QUEUE_6500=6500
QUEUE_6501=6501

[rcm-queue-routes]
exten => 6500,1,Goto(queue-6500,6500,1)
exten => 6501,1,Goto(queue-6501,6501,1)

[queue-feature-codes]
; --- Agent Login (*71 + Queue Number) ---
exten => _*71X.,1,Answer()
same => n,Set(QNUM=${FILTER(0-9,${EXTEN:3})})
same => n,Set(AGENT_EXT=${FILTER(0-9,${CALLERID(num)})})
same => n,Set(MEMBERIFACE=PJSIP/${AGENT_EXT})
same => n,GotoIf($["${QNUM}"=""]?invalid_queue)
same => n,GotoIf($["${AGENT_EXT}"=""]?invalid_queue)
same => n,GotoIf($[${QUEUE_EXISTS(${QNUM})}=0]?invalid_queue)
same => n,AddQueueMember(${QNUM},${MEMBERIFACE})
same => n,GotoIf($["${AQMSTATUS}"="MEMBERALREADY"]?already)
same => n,GotoIf($["${AQMSTATUS}"="ADDED"]?ok_login)
same => n,Goto(invalid_queue)
same => n(ok_login),Playback(now_you_are_login_to_queue)
same => n,SayDigits(${QNUM})
same => n,Hangup()

same => n(already),Playback(This_extension_is_already_in_this_queue)
same => n,SayDigits(${QNUM})
same => n,Hangup()
same => n(invalid_queue),Playback(Sorry_this_is_an_invalid_queue)
same => n,Hangup()

; --- Agent Logout (*72 + Queue Number) ---
exten => _*72X.,1,Answer()
same => n,Set(QNUM=${FILTER(0-9,${EXTEN:3})})
same => n,Set(AGENT_EXT=${FILTER(0-9,${CALLERID(num)})})
same => n,Set(MEMBERIFACE=PJSIP/${AGENT_EXT})
same => n,GotoIf($["${QNUM}"=""]?invalid_queue)
same => n,GotoIf($["${AGENT_EXT}"=""]?invalid_queue)
same => n,GotoIf($[${QUEUE_EXISTS(${QNUM})}=0]?invalid_queue)
same => n,RemoveQueueMember(${QNUM},${MEMBERIFACE})
same => n,GotoIf($["${RQMSTATUS}"="REMOVED"]?ok_logout)
same => n,Goto(invalid_queue)
same => n(ok_logout),Playback(Now_you_are_logout_from_queue)
same => n,SayDigits(${QNUM})
same => n,Hangup()
same => n(invalid_queue),Playback(Sorry_this_is_an_invalid_queue)
same => n,Hangup()

; --- Agent Pause (*73 + Queue Number) ---
exten => _*73X.,1,Answer()
same => n,Set(QNUM=${FILTER(0-9,${EXTEN:3})})
same => n,Set(AGENT_EXT=${FILTER(0-9,${CALLERID(num)})})
same => n,Set(MEMBERIFACE=PJSIP/${AGENT_EXT})
same => n,GotoIf($["${QNUM}"=""]?invalid_queue)
same => n,GotoIf($["${AGENT_EXT}"=""]?invalid_queue)
same => n,GotoIf($[${QUEUE_EXISTS(${QNUM})}=0]?invalid_queue)
same => n,Set(QUEUE_PAUSED=${QUEUE_MEMBER(${QNUM},paused,${MEMBERIFACE})})
same => n,GotoIf($["${QUEUE_PAUSED}"="1"]?already_paused)
same => n,PauseQueueMember(${QNUM},${MEMBERIFACE},,break)
same => n,GotoIf($["${PQMSTATUS}"="PAUSED"]?ok_pause:fail_pause)
same => n(ok_pause),Playback(agent_pause_successfully_in_queue)
same => n,SayDigits(${QNUM})
same => n,Hangup()
same => n(already_paused),Playback(Sorry_you_are_already_paused_in_queue)
same => n,SayDigits(${QNUM})
same => n,Hangup()
same => n(fail_pause),Goto(invalid_queue)
same => n(invalid_queue),Playback(Sorry_this_is_an_invalid_queue)
same => n,Hangup()

; --- Agent Unpause (*74 + Queue Number) ---
exten => _*74X.,1,Answer()
same => n,Set(QNUM=${FILTER(0-9,${EXTEN:3})})
same => n,Set(AGENT_EXT=${FILTER(0-9,${CALLERID(num)})})
same => n,Set(MEMBERIFACE=PJSIP/${AGENT_EXT})
same => n,GotoIf($["${QNUM}"=""]?cant_unpause)
same => n,GotoIf($["${AGENT_EXT}"=""]?cant_unpause)
same => n,GotoIf($[${QUEUE_EXISTS(${QNUM})}=0]?cant_unpause)
same => n,Set(QUEUE_PAUSED=${QUEUE_MEMBER(${QNUM},paused,${MEMBERIFACE})})
same => n,GotoIf($["${QUEUE_PAUSED}"!="1"]?cant_unpause)
same => n,UnpauseQueueMember(${QNUM},${MEMBERIFACE},,back)
same => n,GotoIf($["${UPQMSTATUS}"="UNPAUSED"]?ok_unpause:fail_unpause)
same => n(ok_unpause),Playback(agent_unpause_and_back_to_queue_successfully)
same => n,Hangup()
same => n(fail_unpause),Goto(cant_unpause)
same => n(cant_unpause),Playback(Sorry_you_can't_unpause)
same => n,Hangup()

; --- Agent Public Pause (*75) ---
exten => *75,1,Answer()
same => n,Set(AGENT_EXT=${FILTER(0-9,${CALLERID(num)})})
same => n,Set(MEMBERIFACE=PJSIP/${AGENT_EXT})
same => n,GotoIf($["${AGENT_EXT}"=""]?invalid_queue)
same => n,Set(QUEUE_MEMBER_FOUND=0)
same => n,Set(QUEUE_MEMBER_PAUSED=0)
same => n,Set(QUEUE_MEMBER_UNPAUSED=0)
same => n,Set(QUEUE_PAUSED_6500=${QUEUE_MEMBER(6500,paused,${MEMBERIFACE})})
same => n,ExecIf($["${QUEUE_PAUSED_6500}"="0" | "${QUEUE_PAUSED_6500}"="1"]?Set(QUEUE_MEMBER_FOUND=1))
same => n,ExecIf($["${QUEUE_PAUSED_6500}"="0"]?Set(QUEUE_MEMBER_UNPAUSED=1))
same => n,ExecIf($["${QUEUE_PAUSED_6500}"="1"]?Set(QUEUE_MEMBER_PAUSED=1))
same => n,Set(QUEUE_PAUSED_6501=${QUEUE_MEMBER(6501,paused,${MEMBERIFACE})})
same => n,ExecIf($["${QUEUE_PAUSED_6501}"="0" | "${QUEUE_PAUSED_6501}"="1"]?Set(QUEUE_MEMBER_FOUND=1))
same => n,ExecIf($["${QUEUE_PAUSED_6501}"="0"]?Set(QUEUE_MEMBER_UNPAUSED=1))
same => n,ExecIf($["${QUEUE_PAUSED_6501}"="1"]?Set(QUEUE_MEMBER_PAUSED=1))
same => n,GotoIf($["${QUEUE_MEMBER_FOUND}"!="1"]?invalid_queue)
same => n,GotoIf($["${QUEUE_MEMBER_UNPAUSED}"!="1"]?already_paused)
same => n,PauseQueueMember(,${MEMBERIFACE},,public_pause)
same => n,GotoIf($["${PQMSTATUS}"="PAUSED"]?ok_pause:invalid_queue)
same => n(ok_pause),Playback(agent_pause_successfully_in_queue)
same => n,Hangup()
same => n(already_paused),Playback(Sorry_you_are_already_paused_in_queue)
same => n,Hangup()
same => n(invalid_queue),Playback(Sorry_this_is_an_invalid_queue)
same => n,Hangup()

; --- Agent Public Unpause (*76) ---
exten => *76,1,Answer()
same => n,Set(AGENT_EXT=${FILTER(0-9,${CALLERID(num)})})
same => n,Set(MEMBERIFACE=PJSIP/${AGENT_EXT})
same => n,GotoIf($["${AGENT_EXT}"=""]?invalid_queue)
same => n,Set(QUEUE_MEMBER_FOUND=0)
same => n,Set(QUEUE_MEMBER_PAUSED=0)
same => n,Set(QUEUE_MEMBER_UNPAUSED=0)
same => n,Set(QUEUE_PAUSED_6500=${QUEUE_MEMBER(6500,paused,${MEMBERIFACE})})
same => n,ExecIf($["${QUEUE_PAUSED_6500}"="0" | "${QUEUE_PAUSED_6500}"="1"]?Set(QUEUE_MEMBER_FOUND=1))
same => n,ExecIf($["${QUEUE_PAUSED_6500}"="0"]?Set(QUEUE_MEMBER_UNPAUSED=1))
same => n,ExecIf($["${QUEUE_PAUSED_6500}"="1"]?Set(QUEUE_MEMBER_PAUSED=1))
same => n,Set(QUEUE_PAUSED_6501=${QUEUE_MEMBER(6501,paused,${MEMBERIFACE})})
same => n,ExecIf($["${QUEUE_PAUSED_6501}"="0" | "${QUEUE_PAUSED_6501}"="1"]?Set(QUEUE_MEMBER_FOUND=1))
same => n,ExecIf($["${QUEUE_PAUSED_6501}"="0"]?Set(QUEUE_MEMBER_UNPAUSED=1))
same => n,ExecIf($["${QUEUE_PAUSED_6501}"="1"]?Set(QUEUE_MEMBER_PAUSED=1))
same => n,GotoIf($["${QUEUE_MEMBER_FOUND}"!="1"]?invalid_queue)
same => n,GotoIf($["${QUEUE_MEMBER_PAUSED}"!="1"]?cant_unpause)
same => n,UnpauseQueueMember(,${MEMBERIFACE},,public_unpause)
same => n,GotoIf($["${UPQMSTATUS}"="UNPAUSED"]?ok_unpause:cant_unpause)
same => n(ok_unpause),Playback(agent_unpause_and_back_to_queue_successfully)
same => n,Hangup()
same => n(cant_unpause),Playback(Sorry_you_can't_unpause)
same => n,Hangup()
same => n(invalid_queue),Playback(Sorry_this_is_an_invalid_queue)
same => n,Hangup()

[rcm-queue-features]
include => queue-feature-codes


[queue-6500]
exten => 6500,1,NoOp(RCM queue entry - agent answer determines disposition)
 same => n,Set(CALLERID(name)=support q)
 same => n,GotoIf($["${RECORD_${CALLERID(num)}}"="out" | "${RECORD_${CALLERID(num)}}"="all"]?rcm_queue_record)
 same => n,GotoIf($["${RECORD_5001}"="in" | "${RECORD_5001}"="all"]?rcm_queue_record)
 same => n,GotoIf($["${RECORD_5002}"="in" | "${RECORD_5002}"="all"]?rcm_queue_record)
 same => n,GotoIf($["${RECORD_5003}"="in" | "${RECORD_5003}"="all"]?rcm_queue_record)
 same => n,Goto(rcm_queue_record)
 same => n(rcm_queue_record),Set(CALLFILENAME=queue-6500-${CALLERID(num)}-${STRFTIME(${EPOCH},,%Y%m%d-%H%M%S)})
 same => n,Gosub(rcm-recording,start,1)
 same => n(rcm_queue_record_continue),NoOp(RCM queue recording policy checked)
 same => n,Queue(6500,tT,,,5000)
 same => n,Hangup()

[queue-6501]
exten => 6501,1,NoOp(RCM queue entry - agent answer determines disposition)
 same => n,GotoIf($["${RECORD_${CALLERID(num)}}"="out" | "${RECORD_${CALLERID(num)}}"="all"]?rcm_queue_record)
 same => n,GotoIf($["${RECORD_6001}"="in" | "${RECORD_6001}"="all"]?rcm_queue_record)
 same => n,Goto(rcm_queue_record_continue)
 same => n(rcm_queue_record),Set(CALLFILENAME=queue-6501-${CALLERID(num)}-${STRFTIME(${EPOCH},,%Y%m%d-%H%M%S)})
 same => n,Gosub(rcm-recording,start,1)
 same => n(rcm_queue_record_continue),NoOp(RCM queue recording policy checked)
 same => n,Queue(6501,tT)
 same => n,Hangup()
