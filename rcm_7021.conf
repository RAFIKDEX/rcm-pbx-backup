<VirtualHost *:80>

    ServerName localhost

    WSGIDaemonProcess rcm7021 user=www-data group=www-data threads=5

    WSGIScriptAlias / /root/RCM_7021/rcm_wsgi.wsgi


    <Directory /root/RCM_7021>

        WSGIProcessGroup rcm7021

        WSGIApplicationGroup %{GLOBAL}

        Require all granted

    </Directory>

</VirtualHost>
