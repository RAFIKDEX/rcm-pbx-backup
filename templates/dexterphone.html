<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>DEXTER Phone Professional</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="/static/css/dexterphone.css">
</head>
<body data-theme="dark">
  <div class="app-container">
    
    <!-- Top Status Bar -->
    <header class="top-status-bar">
      <a href="/dashboard" class="icon-btn" title="Back to PBX Dashboard" style="margin-right: 15px; color: var(--sky);"><i class="fa-solid fa-arrow-left"></i></a>
      <div class="brand">
        <div class="brand-logo"><i class="fa-solid fa-phone-flip"></i></div>
        <div>
          <h1>DEXTER PHONE</h1>
          <span id="sip-uri-display">Not Configured</span>
        </div>
      </div>
      <div class="top-actions">
        <div class="status-pill" id="conn-status-pill"><i class="fa-solid fa-circle"></i> <span id="conn-status-text">Offline</span></div>
        <button id="btn-theme-toggle" class="icon-btn"><i class="fa-solid fa-moon"></i></button>
      </div>
    </header>

    <div class="main-workspace">
      <!-- Left Sidebar: BLF & Speed Dials -->
      <aside class="sidebar">
        <div class="sidebar-section">
          <h3>SPEED DIALS</h3>
          <div id="speed-dial-list" class="contact-list">
             <!-- User requested programmable buttons -->
             <button class="speed-dial-btn" onclick="dialNumber('*10')"><i class="fa-solid fa-bolt"></i> Break Code (*10)</button>
             <button class="speed-dial-btn" onclick="dialNumber('*20')"><i class="fa-solid fa-bolt"></i> Lunch (*20)</button>
             <button class="speed-dial-btn" onclick="dialNumber('*99')"><i class="fa-solid fa-voicemail"></i> Voicemail</button>
          </div>
        </div>
        
        <div class="sidebar-section" style="flex:1;">
          <h3>COMPANY DIRECTORY (BLF)</h3>
          <div class="search-box">
             <i class="fa-solid fa-search"></i>
             <input type="text" id="blf-search" placeholder="Search colleagues...">
          </div>
          <div id="blf-list" class="contact-list">
            <!-- Populated via API -->
          </div>
        </div>
        
        <!-- Audio Hot-Swap / Settings -->
        <div class="sidebar-section audio-settings">
          <h3>HARDWARE AUDIO</h3>
          <select id="audio-input-select" class="hardware-select" title="Microphone"></select>
          <select id="audio-output-select" class="hardware-select" title="Speaker"></select>
          <button id="btn-show-settings" class="icon-btn" style="width:100%; margin-top:8px;"><i class="fa-solid fa-gear"></i> SIP Settings</button>
        </div>
      </aside>

      <!-- Center Stage Area -->
      <main class="center-stage" id="center-stage">
        
        <!-- Dialer View -->
        <div id="view-dialer" class="stage-view active">
          <div class="dialer-wrapper">
             <input type="text" id="dial-input" placeholder="Enter number..." readonly>
             <div class="dialpad">
               <button class="keypad-btn" data-key="1">1<span></span></button>
               <button class="keypad-btn" data-key="2">2<span>ABC</span></button>
               <button class="keypad-btn" data-key="3">3<span>DEF</span></button>
               <button class="keypad-btn" data-key="4">4<span>GHI</span></button>
               <button class="keypad-btn" data-key="5">5<span>JKL</span></button>
               <button class="keypad-btn" data-key="6">6<span>MNO</span></button>
               <button class="keypad-btn" data-key="7">7<span>PQRS</span></button>
               <button class="keypad-btn" data-key="8">8<span>TUV</span></button>
               <button class="keypad-btn" data-key="9">9<span>WXYZ</span></button>
               <button class="keypad-btn" data-key="*">*<span></span></button>
               <button class="keypad-btn" data-key="0">0<span>+</span></button>
               <button class="keypad-btn" data-key="#">#<span></span></button>
             </div>
             <div class="dialer-actions">
               <button id="btn-dial-call" class="call-btn"><i class="fa-solid fa-phone"></i> CALL</button>
               <button id="btn-dial-clear" class="clear-btn"><i class="fa-solid fa-delete-left"></i></button>
             </div>
          </div>
        </div>

        <!-- In-Call Views Container -->
        <div id="view-calls" class="stage-view">
           <!-- Multi-Call Island -->
           <div id="multi-call-island" class="multi-call-island hidden">
              <div class="island-header">
                 <span class="amber-badge">⏸️ ON HOLD</span>
                 <span id="island-held-name">Ext. 2121</span>
                 <button id="btn-island-end" class="pill-btn red"><i class="fa-solid fa-xmark"></i></button>
              </div>
              <div class="island-actions">
                 <button id="btn-island-swap" class="pill-btn sky"><i class="fa-solid fa-arrow-right-arrow-left"></i> Swap Calls</button>
                 <button id="btn-island-merge" class="pill-btn green"><i class="fa-solid fa-users"></i> Merge 3-Way</button>
                 <button id="btn-island-transfer" class="pill-btn purple"><i class="fa-solid fa-share"></i> Transfer</button>
              </div>
           </div>
           
           <!-- Active Call Stage -->
           <div id="active-call-stage" class="active-call-stage">
              <div class="codec-pill" id="codec-pill"><i class="fa-solid fa-wave-square"></i> HD VOICE</div>
              <div class="caller-avatar">
                 <div class="pulse-ring"></div>
                 <div class="pulse-ring delay"></div>
                 <i class="fa-solid fa-user"></i>
              </div>
              <h2 id="active-caller-name">Unknown</h2>
              <div class="call-status" id="active-call-status">Connecting...</div>
              <div class="call-timer" id="active-call-timer">00:00</div>
              
              <!-- Bottom Controls -->
              <div class="in-call-controls" id="in-call-controls">
                 <button class="ctrl-btn" id="btn-ctrl-mute" title="Mute"><i class="fa-solid fa-microphone-slash"></i></button>
                 <button class="ctrl-btn" id="btn-ctrl-keypad" title="Keypad"><i class="fa-solid fa-th"></i></button>
                 <button class="ctrl-btn" id="btn-ctrl-hold" title="Hold"><i class="fa-solid fa-pause"></i></button>
                 <button class="ctrl-btn" id="btn-ctrl-transfer" title="Transfer"><i class="fa-solid fa-share-nodes"></i></button>
              </div>
              <button class="end-call-btn" id="btn-ctrl-end"><i class="fa-solid fa-phone-slash"></i> END CALL</button>
           </div>
           
           <!-- Transfer Sheet -->
           <div id="transfer-sheet" class="transfer-sheet hidden">
              <h3>Transfer Call</h3>
              <input type="text" id="transfer-target" class="form-control" placeholder="Target Number">
              <div class="transfer-actions">
                 <button id="btn-blind-transfer" class="pill-btn purple">Blind Transfer</button>
                 <button id="btn-attended-transfer" class="pill-btn sky">Attended Transfer</button>
                 <button id="btn-cancel-transfer" class="pill-btn">Cancel</button>
              </div>
           </div>
        </div>

      </main>
    </div>

    <!-- Incoming Call Modal -->
    <div id="incoming-modal" class="incoming-modal hidden">
       <div class="incoming-card">
          <div class="incoming-avatar"><i class="fa-solid fa-phone-volume fa-shake"></i></div>
          <h3>Incoming Call</h3>
          <div id="incoming-caller-info" class="incoming-info">Ext. 200</div>
          <div class="incoming-actions">
             <button id="btn-incoming-accept" class="accept-btn"><i class="fa-solid fa-check"></i> Accept</button>
             <button id="btn-incoming-reject" class="reject-btn"><i class="fa-solid fa-xmark"></i> Decline</button>
          </div>
       </div>
    </div>

    <!-- Settings Modal -->
    <div id="settings-modal" class="modal-overlay hidden">
       <div class="modal-content">
          <h2><i class="fa-solid fa-gear"></i> SIP Configuration</h2>
          <div class="form-group">
            <label>Extension / Username</label>
            <input type="text" id="sip-ext" class="form-control" placeholder="1001">
          </div>
          <div class="form-group">
            <label>Password / Secret</label>
            <input type="password" id="sip-pwd" class="form-control">
          </div>
          <div class="form-group" style="display:none;">
            <label>Server IP</label>
            <input type="text" id="sip-server" class="form-control">
          </div>
          <div class="modal-actions">
             <button id="btn-save-settings" class="save-btn">Save & Register</button>
             <button id="btn-close-settings" class="cancel-btn">Close</button>
          </div>
       </div>
    </div>

  </div>

  <audio id="ringback-audio" src="/static/sounds/ringback.wav" loop></audio>
  <audio id="ringing-audio" src="/static/sounds/ring.wav" loop></audio>

  <script src="/static/js/sip.min.js"></script>
  <script src="/static/js/dexterphone.js"></script>
</body>
</html>
