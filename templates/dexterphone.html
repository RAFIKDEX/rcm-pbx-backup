{% extends 'base.html' %}
{% block title %}DEXTER Phone Professional{% endblock %}

{% block content %}
<link rel="stylesheet" href="/static/css/dexterphone_desktop.css?v=1">
<div class="header-panel">
    <h1><i class="fa-solid fa-headset text-primary"></i> DEXTER WebRTC Softphone</h1>
    <div class="top-status-indicator" id="main-status-indicator">
        <div class="pulse-dot bg-danger" id="status-dot"></div>
        <span id="status-text" class="text-muted">Offline</span>
    </div>
</div>

<div class="desktop-phone-grid">
    <!-- Left Column: Dialer, Settings & BLF -->
    <div class="phone-col-left">
        <!-- Settings Panel -->
        <div class="panel" id="auth-panel">
            <div class="panel-header"><h2><i class="fa-solid fa-user-lock"></i> SIP Authentication</h2></div>
            <div class="form-group">
                <label>Extension</label>
                <input type="text" id="sip-ext" class="form-control" placeholder="e.g. 2121">
            </div>
            <div class="form-group">
                <label>Secret</label>
                <input type="password" id="sip-pwd" class="form-control" placeholder="SIP Password">
            </div>
            <button class="btn btn-info w-100" id="btn-save-settings"><i class="fa-solid fa-satellite-dish"></i> Register</button>
        </div>

        <!-- Dialer Panel -->
        <div class="panel hidden" id="dialer-panel">
            <div class="panel-header" style="padding-bottom: 10px; margin-bottom: 15px;">
                <h2 style="font-size: 1rem;"><i class="fa-solid fa-phone-flip"></i> Dialer</h2>
                <div class="audio-meters-row" title="Microphone Level">
                    <div class="vu-bar-wrap" id="mic-vu">
                        <div class="vu-seg"></div><div class="vu-seg"></div><div class="vu-seg"></div>
                        <div class="vu-seg"></div><div class="vu-seg"></div><div class="vu-seg"></div>
                    </div>
                </div>
            </div>
            <div class="dialer-display">
                <input type="text" id="dial-input" class="form-control text-center" style="font-size: 1.5rem; letter-spacing: 2px; font-weight: bold; background: var(--bg-dark);" placeholder="Enter Number">
            </div>
            <div class="dialpad-grid mt-3">
                <button class="dial-key" data-key="1"><span class="num">1</span><span class="sub">&nbsp;</span></button>
                <button class="dial-key" data-key="2"><span class="num">2</span><span class="sub">ABC</span></button>
                <button class="dial-key" data-key="3"><span class="num">3</span><span class="sub">DEF</span></button>
                <button class="dial-key" data-key="4"><span class="num">4</span><span class="sub">GHI</span></button>
                <button class="dial-key" data-key="5"><span class="num">5</span><span class="sub">JKL</span></button>
                <button class="dial-key" data-key="6"><span class="num">6</span><span class="sub">MNO</span></button>
                <button class="dial-key" data-key="7"><span class="num">7</span><span class="sub">PQRS</span></button>
                <button class="dial-key" data-key="8"><span class="num">8</span><span class="sub">TUV</span></button>
                <button class="dial-key" data-key="9"><span class="num">9</span><span class="sub">WXYZ</span></button>
                <button class="dial-key" data-key="*"><span class="num">*</span></button>
                <button class="dial-key" data-key="0"><span class="num">0</span><span class="sub">+</span></button>
                <button class="dial-key" data-key="#"><span class="num">#</span></button>
            </div>
            <div class="dialer-actions mt-3" style="display: flex; gap: 10px;">
                <button class="btn btn-success" id="btn-dial-call" style="flex: 1; padding: 12px; font-size: 1.1rem;"><i class="fa-solid fa-phone"></i> CALL</button>
                <button class="btn btn-secondary" id="btn-dial-clear" style="padding: 12px;"><i class="fa-solid fa-delete-left"></i></button>
            </div>
        </div>

        <!-- Audio Devices -->
        <div class="panel hidden" id="hardware-panel" style="padding: 1rem 1.5rem;">
            <h2 style="font-size: 0.9rem; margin-bottom: 10px; color: var(--text-muted);"><i class="fa-solid fa-sliders"></i> Hardware</h2>
            <select id="audio-input-select" class="form-control mb-2" style="font-size: 0.8rem; padding: 5px;"></select>
            <select id="audio-output-select" class="form-control" style="font-size: 0.8rem; padding: 5px;"></select>
        </div>
    </div>

    <!-- Right Column: Active Calls & WebRTC Dashboard -->
    <div class="phone-col-right">
        <!-- Calls Container -->
        <div id="calls-container" class="calls-container">
            <!-- Empty State -->
            <div class="empty-calls-state" id="empty-state">
                <i class="fa-solid fa-phone-slash" style="font-size: 3rem; color: rgba(255,255,255,0.05); margin-bottom: 15px;"></i>
                <h3 style="color: var(--text-dark);">No Active Calls</h3>
                <p style="color: var(--text-muted); font-size: 0.85rem;">Dial a number or wait for an incoming call.</p>
            </div>
            <!-- Call cards will be injected here by JS -->
        </div>

        <!-- Incoming Call Modal (Overlay inside Right Col) -->
        <div id="incoming-modal" class="incoming-modal hidden">
            <div class="incoming-card">
                <div class="pulse-ring"></div>
                <div class="incoming-avatar"><i class="fa-solid fa-user"></i></div>
                <h2 id="incoming-name">Unknown</h2>
                <p>Incoming Call...</p>
                <div class="incoming-actions">
                    <button class="btn btn-success" id="btn-accept"><i class="fa-solid fa-phone"></i> Accept</button>
                    <button class="btn btn-danger" id="btn-reject"><i class="fa-solid fa-phone-slash"></i> Reject</button>
                </div>
            </div>
        </div>
    </div>
</div>

<audio id="ringback-audio" src="/static/sounds/ringback.wav" loop></audio>
<audio id="ringing-audio" src="/static/sounds/ring.wav" loop></audio>

<!-- Templates for JS -->
<template id="tpl-call-card">
    <div class="panel call-card" data-session-id="">
        <div class="call-card-header">
            <div class="call-info">
                <div class="call-avatar"><i class="fa-solid fa-user-astronaut"></i></div>
                <div>
                    <h3 class="caller-name">Unknown</h3>
                    <div class="call-meta">
                        <span class="call-status badge bg-primary">Connecting...</span>
                        <span class="call-timer text-muted"><i class="fa-regular fa-clock"></i> 00:00</span>
                        <span class="call-codec badge bg-dark"><i class="fa-solid fa-wave-square"></i> N/A</span>
                    </div>
                </div>
            </div>
        </div>
        
        <!-- Transfer Sheet -->
        <div class="transfer-sheet hidden mt-3 p-3" style="background: var(--bg-dark); border-radius: 10px; border: 1px solid var(--border-color);">
            <h4 style="font-size: 0.9rem; margin-bottom: 10px;">Transfer Call</h4>
            <div class="d-flex gap-2">
                <input type="text" class="form-control transfer-target" placeholder="Extension">
                <button class="btn btn-info btn-sm btn-blind-transfer">Blind</button>
                <button class="btn btn-success btn-sm btn-attended-transfer" title="Requires another active/held call">Attended</button>
                <button class="btn btn-secondary btn-sm btn-cancel-transfer">Cancel</button>
            </div>
        </div>

        <div class="call-card-actions mt-3" style="display: flex; gap: 10px; flex-wrap: wrap;">
            <button class="btn btn-secondary btn-sm btn-mute" title="Mute Mic"><i class="fa-solid fa-microphone"></i> Mute</button>
            <button class="btn btn-secondary btn-sm btn-hold" title="Hold Call"><i class="fa-solid fa-pause"></i> Hold</button>
            <button class="btn btn-secondary btn-sm btn-transfer-toggle" title="Transfer"><i class="fa-solid fa-share"></i> Transfer</button>
            <button class="btn btn-secondary btn-sm btn-merge hidden" title="Merge 3-Way Conference"><i class="fa-solid fa-users"></i> Merge</button>
            <button class="btn btn-danger btn-sm btn-end" style="margin-left: auto;"><i class="fa-solid fa-phone-slash"></i> End</button>
        </div>
        
        <!-- Diagnostics Dropdown -->
        <div class="webrtc-stats mt-3 pt-3" style="border-top: 1px dashed var(--border-color); font-size: 0.75rem; color: var(--text-dark); display: flex; justify-content: space-between;">
            <span class="stat-jitter">Jitter: 0ms</span>
            <span class="stat-loss">Loss: 0%</span>
            <span class="stat-rtt">RTT: 0ms</span>
            <span class="stat-ice">ICE: New</span>
        </div>
    </div>
</template>

<script src="/static/js/sip.min.js"></script>
<script src="/static/js/dexterphone_desktop.js?v=1"></script>
{% endblock %}
