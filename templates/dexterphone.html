<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>DEXTER Phone Professional</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="/static/css/dexterphone.css?v=9">
</head>
<body data-theme="dark">

<div class="showcase-header">
  <div class="brand-title">
    <div class="brand-logo-icon">DX</div>
    <div>
      <h1 style="font-family: 'Orbitron', sans-serif; font-weight: 900; letter-spacing: 1.5px; color: var(--primary);">DEXTER PHONE</h1>
      <span>WEB-RTC PBX EDITION</span>
    </div>
  </div>
  <div class="header-actions">
    <div class="status-pill" id="conn-status-pill"><i class="fa-solid fa-circle"></i> <span id="conn-status-text">Offline</span></div>
  </div>
</div>

<div class="showcase-stage">
  <div class="phone-mockup">
    <!-- Softphone Topbar -->
    <div class="soft-topbar">
      <div class="soft-brand"><i class="fa-solid fa-phone-flip"></i> DEXTER</div>
      <div class="soft-pill" id="sip-uri-display">Not Configured</div>
    </div>

    <!-- Softphone Content Area -->
    <div class="soft-content">
      
      <!-- View: Settings (Auth) -->
      <div id="settings-modal" class="in-call-screen" style="z-index: 30; background: var(--bg);">
        <h3 style="margin-bottom:15px; text-align:center; margin-top:20px;">SIP Login</h3>
        <input type="text" id="sip-ext" class="form-control" placeholder="Ext (e.g. 2121)" style="margin-bottom:10px; width:100%; padding:10px; background:var(--card); border:1px solid var(--border); color:#fff; border-radius:10px;">
        <input type="password" id="sip-pwd" class="form-control" placeholder="Password" style="margin-bottom:20px; width:100%; padding:10px; background:var(--card); border:1px solid var(--border); color:#fff; border-radius:10px;">
        <h4 style="margin-bottom:10px; font-size:12px; color:var(--text2);">Hardware</h4>
        <select id="audio-input-select" style="margin-bottom:10px; width:100%; padding:8px; background:var(--card); border:1px solid var(--border); color:#fff; border-radius:8px; font-size:11px;"></select>
        <select id="audio-output-select" style="margin-bottom:20px; width:100%; padding:8px; background:var(--card); border:1px solid var(--border); color:#fff; border-radius:8px; font-size:11px;"></select>
        <button id="btn-save-settings" class="call-trigger-btn" style="width:100%;">Connect</button>
      </div>

      <!-- View: Dialer -->
      <div id="view-dialer" class="dialer-view active">
        <div class="audio-meters-row">
            <div class="meter-col">
                <div class="meter-label">MIC LEVEL</div>
                <div class="vu-bar-wrap" id="mic-vu">
                    <div class="vu-seg lit-green"></div><div class="vu-seg lit-green"></div><div class="vu-seg lit-yellow"></div>
                    <div class="vu-seg"></div><div class="vu-seg"></div><div class="vu-seg"></div>
                </div>
            </div>
        </div>
        
        <div class="dialer-input-box" style="margin-top: 10px;">
            <input type="text" id="dial-input" class="dialer-digits" style="width:100%; background:transparent; border:none; color:#fff; outline:none; text-align:center;" placeholder="Enter Number" readonly>
            <i class="fa-solid fa-delete-left" id="btn-dial-clear" style="color:var(--text3); cursor:pointer;"></i>
        </div>
        
        <div class="dialpad-grid" style="margin-top: 15px;">
            <div class="dial-key" data-key="1"><span class="num">1</span><span class="sub">&nbsp;</span></div>
            <div class="dial-key" data-key="2"><span class="num">2</span><span class="sub">ABC</span></div>
            <div class="dial-key" data-key="3"><span class="num">3</span><span class="sub">DEF</span></div>
            <div class="dial-key" data-key="4"><span class="num">4</span><span class="sub">GHI</span></div>
            <div class="dial-key" data-key="5"><span class="num">5</span><span class="sub">JKL</span></div>
            <div class="dial-key" data-key="6"><span class="num">6</span><span class="sub">MNO</span></div>
            <div class="dial-key" data-key="7"><span class="num">7</span><span class="sub">PQRS</span></div>
            <div class="dial-key" data-key="8"><span class="num">8</span><span class="sub">TUV</span></div>
            <div class="dial-key" data-key="9"><span class="num">9</span><span class="sub">WXYZ</span></div>
            <div class="dial-key" data-key="*"><span class="num">*</span><span class="sub"></span></div>
            <div class="dial-key" data-key="0"><span class="num">0</span><span class="sub">+</span></div>
            <div class="dial-key" data-key="#"><span class="num">#</span><span class="sub"></span></div>
        </div>
        
        <button id="btn-dial-call" class="call-trigger-btn" style="margin-top: 20px;">
            <i class="fa-solid fa-phone"></i> CALL
        </button>
      </div>

      <!-- View: Active Call Stage -->
      <div id="view-calls" class="in-call-screen hidden">
        <div class="call-hud">
          <div class="hd-pill"><span>●</span> ACTIVE CALL</div>
          <div class="codec-badge">HD Voice</div>
        </div>
        
        <div class="caller-center">
          <div class="avatar-wrapper">
            <div class="pulse-ring-outer"></div>
            <div class="avatar-circle"><i class="fa-solid fa-user"></i></div>
          </div>
          <div class="caller-name" id="active-caller-name">Unknown</div>
          <div class="caller-ext" id="active-call-status">Connecting...</div>
          <div class="call-time-counter" id="active-call-timer">00:00</div>
        </div>
        
        <!-- Multi-Call Island -->
        <div class="multi-call-card-mockup hidden" id="multi-call-island">
            <div class="card-top-row">
                <div class="held-badge-pill"><span style="color:#F59E0B; font-size:7px;">●</span> <span>ON HOLD</span></div>
                <div class="held-party-title" id="island-held-name">Unknown</div>
                <button class="end-held-pill" id="btn-island-end">✕ End</button>
            </div>
            <div class="card-actions-row">
                <button class="action-pill-btn swap" id="btn-island-swap"><span>⇄</span> <span>Swap Calls</span></button>
                <button class="action-pill-btn merge" id="btn-island-merge"><span>⛙</span> <span>Merge 3-Way</span></button>
            </div>
        </div>
        
        <!-- Transfer Sheet -->
        <div class="multi-call-card-mockup hidden" id="transfer-sheet" style="border-color: #38BDF8;">
            <div class="card-top-row" style="margin-bottom: 5px;">
                <input type="text" id="transfer-target" placeholder="Target Ext" style="width:100%; background:var(--bg); border:1px solid var(--border); color:#fff; padding:5px; border-radius:6px; outline:none; text-align:center;">
            </div>
            <div class="card-actions-row">
                <button class="action-pill-btn swap" id="btn-blind-transfer" style="color:#FFF; background:var(--sky); border:none;">Blind</button>
                <button class="action-pill-btn merge" id="btn-attended-transfer" style="color:#FFF; background:var(--go); border:none;">Attended</button>
                <button class="action-pill-btn" id="btn-cancel-transfer" style="color:#FFF; background:var(--stop); border:none;">Cancel</button>
            </div>
        </div>

        <div class="controls-grid-6">
            <button class="ctrl-circle-btn" id="btn-mute"><div class="ctrl-circle">🎤</div><span>Mute</span></button>
            <button class="ctrl-circle-btn" id="btn-keypad"><div class="ctrl-circle">⌨️</div><span>Keypad</span></button>
            <button class="ctrl-circle-btn" id="btn-hold"><div class="ctrl-circle">⏸️</div><span>Hold</span></button>
            <button class="ctrl-circle-btn" id="btn-transfer"><div class="ctrl-circle">➦</div><span>Transfer</span></button>
            <button class="ctrl-circle-btn" id="btn-add-call"><div class="ctrl-circle">➕</div><span>Add Call</span></button>
        </div>
        <button class="end-call-bar" id="btn-end"><span>✕</span><span>END CALL</span></button>
        
        <!-- In-Call Keypad Overlay -->
        <div class="dialpad-grid hidden" id="in-call-keypad" style="position: absolute; bottom: 80px; left: 14px; right: 14px; background: rgba(8,11,18,0.95); padding: 15px; border-radius: 16px; border: 1px solid var(--border); backdrop-filter: blur(10px);">
            <div class="dial-key" data-key="1"><span class="num">1</span></div>
            <div class="dial-key" data-key="2"><span class="num">2</span></div>
            <div class="dial-key" data-key="3"><span class="num">3</span></div>
            <div class="dial-key" data-key="4"><span class="num">4</span></div>
            <div class="dial-key" data-key="5"><span class="num">5</span></div>
            <div class="dial-key" data-key="6"><span class="num">6</span></div>
            <div class="dial-key" data-key="7"><span class="num">7</span></div>
            <div class="dial-key" data-key="8"><span class="num">8</span></div>
            <div class="dial-key" data-key="9"><span class="num">9</span></div>
            <div class="dial-key" data-key="*"><span class="num">*</span></div>
            <div class="dial-key" data-key="0"><span class="num">0</span></div>
            <div class="dial-key" data-key="#"><span class="num">#</span></div>
        </div>
      </div>

    </div>

    <!-- Incoming Modal Mockup -->
    <div class="incoming-modal-mockup hidden" id="incoming-modal">
        <div class="incoming-avatar"><i class="fa-solid fa-user"></i></div>
        <div class="incoming-name" id="incoming-info">Unknown</div>
        <div class="incoming-state">Incoming Call...</div>
        <div class="incoming-actions" style="display:flex; gap:20px; margin-top:30px; width:100%; justify-content:center;">
            <button class="inc-btn inc-accept" id="btn-accept" style="width:60px; height:60px; border-radius:50%; background:#10B981; border:none; color:#fff; font-size:24px; cursor:pointer; box-shadow:0 0 20px rgba(16,185,129,0.5);"><i class="fa-solid fa-phone"></i></button>
            <button class="inc-btn inc-reject" id="btn-reject" style="width:60px; height:60px; border-radius:50%; background:#EF4444; border:none; color:#fff; font-size:24px; cursor:pointer; box-shadow:0 0 20px rgba(239,68,68,0.5);"><i class="fa-solid fa-phone-slash"></i></button>
        </div>
    </div>
  </div>
</div>

<audio id="ringback-audio" src="/static/sounds/ringback.wav" loop></audio>
<audio id="ringing-audio" src="/static/sounds/ring.wav" loop></audio>

<script src="/static/js/sip.min.js"></script>
<script src="/static/js/dexterphone.js?v=9"></script>

</body>
</html>
