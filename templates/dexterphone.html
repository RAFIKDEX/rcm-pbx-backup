<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DEXTER Phone WebRTC</title>
    <link rel="icon" type="image/png" href="/Logo.png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="/static/css/dexterphone.css">
</head>
<body>
    <div class="phone-container">
        <div class="header">
            <h2><i class="fa-solid fa-phone"></i> DEXTER</h2>
            <div class="status" id="status-text">Offline</div>
        </div>

        <!-- Login Screen -->
        <div class="screen active" id="screen-login">
            <h3 style="text-align:center; margin-bottom: 25px;">WebRTC Login</h3>
            <div class="input-group">
                <label>Extension</label>
                <input type="text" id="sip-ext" placeholder="e.g. 2121_webrtc">
            </div>
            <div class="input-group">
                <label>Password</label>
                <input type="password" id="sip-pwd" placeholder="Secret">
            </div>
            <button class="btn btn-success" id="btn-connect" style="margin-top: 15px;">
                <i class="fa-solid fa-bolt"></i> Connect
            </button>
        </div>

        <!-- Multi-call Container -->
        <div id="calls-container" style="padding: 20px;"></div>

        <!-- Dialer Screen -->
        <div class="screen" id="screen-dialer">
            <div class="dial-display">
                <input type="text" id="dial-input" placeholder="Enter number..." readonly>
            </div>
            <div class="keypad">
                <div class="key" onclick="pressDigit('1')">1</div>
                <div class="key" onclick="pressDigit('2')">2</div>
                <div class="key" onclick="pressDigit('3')">3</div>
                <div class="key" onclick="pressDigit('4')">4</div>
                <div class="key" onclick="pressDigit('5')">5</div>
                <div class="key" onclick="pressDigit('6')">6</div>
                <div class="key" onclick="pressDigit('7')">7</div>
                <div class="key" onclick="pressDigit('8')">8</div>
                <div class="key" onclick="pressDigit('9')">9</div>
                <div class="key" onclick="pressDigit('*')">*</div>
                <div class="key" onclick="pressDigit('0')">0</div>
                <div class="key" onclick="pressDigit('#')">#</div>
            </div>
            <div style="display:flex; gap:10px; justify-content:center;">
                <button class="btn btn-success" style="border-radius:50%; width:60px; height:60px; font-size:1.5rem;" onclick="dialNumber()">
                    <i class="fa-solid fa-phone"></i>
                </button>
                <button class="btn btn-dark" style="border-radius:50%; width:60px; height:60px; font-size:1.2rem;" onclick="document.getElementById('dial-input').value = document.getElementById('dial-input').value.slice(0,-1)">
                    <i class="fa-solid fa-delete-left"></i>
                </button>
            </div>
        </div>
    </div>

    <!-- Load SIP.js -->
    <script src="/static/js/sip.min.js"></script>
    <script src="/static/js/dexterphone.js"></script>
</body>
</html>
