{% extends 'base.html' %}
{% block title %}Access Denied{% endblock %}
{% block content %}
<section class="portal-panel" style="max-width: 620px; margin: 8vh auto 0; padding: 38px 24px; text-align: center;">
    <div style="font-size: 2.5rem; color: var(--portal-danger); margin-bottom: 14px;"><i class="fa-solid fa-lock"></i></div>
    <h1 style="font-size: 1.55rem; margin: 0 0 9px;">Access Denied</h1>
    <p style="color: var(--portal-muted); margin: 0 auto 22px;">Extension Users can access only their own portal pages and data.</p>
    <a class="portal-btn primary" href="{{ url_for('extension_portal_dashboard') }}"><i class="fa-solid fa-house"></i> Return to Dashboard</a>
</section>
{% endblock %}
