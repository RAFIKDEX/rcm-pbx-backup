{% extends "base.html" %}
{% block content %}
<div class="content-header" style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem;">
    <div>
        <h2 style="color: var(--text-main); margin: 0;"><i class="fa-solid fa-plus-circle"></i> Add Storage Provider</h2>
        <p style="color: var(--text-muted); margin-top: 0.5rem; font-size: 0.95rem;">Mount external NAS shares or USB drives to expand storage.</p>
    </div>
    <div>
        <a href="{{ url_for('ext_storage_bp.dashboard') }}" class="neu-button" style="background: rgba(148, 163, 184, 0.1); border: 1px solid rgba(148, 163, 184, 0.5); color: #64748b; padding: 10px 20px; text-decoration: none; font-weight: bold; transition: all 0.2s;"><i class="fa-solid fa-arrow-left"></i> Back to Dashboard</a>
    </div>
</div>

<div class="tabs-container">
    <div class="tabs">
        <button class="tab-btn active" onclick="openTab('tab-nas')"><i class="fa-solid fa-network-wired"></i> Add NAS (SMB/NFS)</button>
        <button class="tab-btn" onclick="openTab('tab-usb')"><i class="fa-brands fa-usb"></i> Detect USB Drives</button>
    </div>

    <!-- NAS TAB -->
    <div id="tab-nas" class="tab-content active" style="background: var(--panel-bg); padding: 2rem; border-radius: 0 12px 12px 12px; border: 1px solid var(--border-color);">
        <form method="POST" action="/external-storage/providers/add">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <input type="hidden" name="provider_type" value="nas">
            <h3 style="color: var(--text-main); margin-top: 0; margin-bottom: 1.5rem;">Configure New NAS</h3>
            
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 15px;">
                <div>
                    <label style="display: block; color: var(--text-muted); margin-bottom: 5px;">Provider Name (Alias)</label>
                    <input type="text" name="name" required placeholder="e.g. BackupNAS-01" class="form-control" style="width: 100%; padding: 10px; background: var(--bg-main); color: var(--text-main); border: 1px solid var(--border-color); border-radius: 6px;">
                </div>
                <div>
                    <label style="display: block; color: var(--text-muted); margin-bottom: 5px;">Protocol</label>
                    <select name="protocol" class="form-control" style="width: 100%; padding: 10px; background: var(--bg-main); color: var(--text-main); border: 1px solid var(--border-color); border-radius: 6px;">
                        <option value="smb">SMB / CIFS (Windows/Linux Share)</option>
                        <option value="nfs">NFS (Linux Share)</option>
                    </select>
                </div>
            </div>

            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 15px;">
                <div>
                    <label style="display: block; color: var(--text-muted); margin-bottom: 5px;">Server IP / Hostname</label>
                    <input type="text" name="server" required placeholder="e.g. 192.168.1.100" class="form-control" style="width: 100%; padding: 10px; background: var(--bg-main); color: var(--text-main); border: 1px solid var(--border-color); border-radius: 6px;">
                </div>
                <div>
                    <label style="display: block; color: var(--text-muted); margin-bottom: 5px;">Share Name / Path</label>
                    <input type="text" name="share" required placeholder="e.g. /backups or backups_share" class="form-control" style="width: 100%; padding: 10px; background: var(--bg-main); color: var(--text-main); border: 1px solid var(--border-color); border-radius: 6px;">
                </div>
            </div>

            <div style="margin-bottom: 15px;">
                <label style="display: block; color: var(--text-muted); margin-bottom: 5px;">Base Folder (Optional)</label>
                <input type="text" name="base_folder" placeholder="e.g. RCM_Recordings (Folder will be created inside the share)" class="form-control" style="width: 100%; padding: 10px; background: var(--bg-main); color: var(--text-main); border: 1px solid var(--border-color); border-radius: 6px;">
            </div>

            <h4 style="color: var(--text-main); margin-top: 20px; margin-bottom: 10px; border-bottom: 1px solid var(--border-color); padding-bottom: 5px;">Authentication (SMB only)</h4>
            
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 25px;">
                <div>
                    <label style="display: block; color: var(--text-muted); margin-bottom: 5px;">Username</label>
                    <input type="text" name="username" class="form-control" style="width: 100%; padding: 10px; background: var(--bg-main); color: var(--text-main); border: 1px solid var(--border-color); border-radius: 6px;">
                </div>
                <div>
                    <label style="display: block; color: var(--text-muted); margin-bottom: 5px;">Password</label>
                    <div style="position: relative;">
                        <input type="password" id="nas_password" name="password" class="form-control" autocomplete="new-password" style="width: 100%; padding: 10px; background: var(--bg-main); color: var(--text-main); border: 1px solid var(--border-color); border-radius: 6px; padding-right: 40px;">
                        <button type="button" onclick="togglePassword()" style="position: absolute; right: 10px; top: 50%; transform: translateY(-50%); background: none; border: none; color: var(--text-muted); cursor: pointer;"><i id="nas_pwd_icon" class="fa-solid fa-eye"></i></button>
                    </div>
                </div>
            </div>

            <div style="display: flex; gap: 15px;">
                <button type="submit" class="neu-button btn-success" style="padding: 12px 25px; font-size: 1rem;"><i class="fa-solid fa-save"></i> Save NAS Configuration</button>
            </div>
        </form>
    </div>

    <!-- USB TAB -->
    <div id="tab-usb" class="tab-content" style="display:none; background: var(--panel-bg); padding: 2rem; border-radius: 0 12px 12px 12px; border: 1px solid var(--border-color);">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem;">
            <h3 style="color: var(--text-main); margin: 0;">Connected USB Devices</h3>
            <button onclick="scanUSB()" class="neu-button btn-info"><i class="fa-solid fa-rotate"></i> Scan Now</button>
        </div>
        
        <div id="usb-list" style="color: var(--text-muted); text-align: center; padding: 2rem; background: var(--bg-main); border-radius: 8px;">
            <i class="fa-solid fa-usb" style="font-size: 2.5rem; margin-bottom: 15px; color: #64748b;"></i>
            <p>Click "Scan Now" to detect attached USB drives.</p>
        </div>
    </div>
</div>

<style>
    .tabs { display: flex; gap: 5px; }
    .tab-btn { background: var(--bg-main); border: 1px solid var(--border-color); color: var(--text-muted); padding: 12px 20px; cursor: pointer; border-radius: 8px 8px 0 0; font-weight: bold; transition: all 0.3s; }
    .tab-btn:hover { background: var(--panel-bg); color: var(--text-main); }
    .tab-btn.active { background: var(--panel-bg); color: var(--text-main); border-bottom: none; }
</style>

<script>
function openTab(tabId) {
    document.querySelectorAll('.tab-content').forEach(el => el.style.display = 'none');
    document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
    document.getElementById(tabId).style.display = 'block';
    
    // Safety check in case event is missing
    if(event && event.currentTarget) {
        event.currentTarget.classList.add('active');
    }
}

function scanUSB() {
    const list = document.getElementById('usb-list');
    list.innerHTML = '<p><i class="fa-solid fa-spinner fa-spin"></i> Scanning for USB devices...</p>';
    setTimeout(() => {
        list.innerHTML = '<p style="color: #fb7185;"><i class="fa-solid fa-triangle-exclamation"></i> API Not Linked Yet (Phase 1 WIP)</p>';
    }, 1000);
}

function togglePassword() {
    var pwdInput = document.getElementById('nas_password');
    var pwdIcon = document.getElementById('nas_pwd_icon');
    if (pwdInput.type === "password") {
        pwdInput.type = "text";
        pwdIcon.classList.remove('fa-eye');
        pwdIcon.classList.add('fa-eye-slash');
    } else {
        pwdInput.type = "password";
        pwdIcon.classList.remove('fa-eye-slash');
        pwdIcon.classList.add('fa-eye');
    }
}
</script>
{% endblock %}
