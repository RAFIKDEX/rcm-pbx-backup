# Grandstream phones request provisioning over plain HTTP.  Keep this
# listener separate from the existing HTTPS Fanvil/FiberMe listener because
# the tested Grandstream firmware rejects the deployment's self-signed TLS
# certificate during provisioning.
Listen 8091

<VirtualHost *:8091>
    ServerName 192.168.99.223

    Alias /DEXPhone/ /var/lib/rcm/provisioning/DEXPhone/
    <Directory /var/lib/rcm/provisioning/DEXPhone/>
        Options -Indexes
        AllowOverride None
        Require all granted
    </Directory>

    <FilesMatch "^cfg[0-9a-f]{12}(\.xml)?$">
        ForceType application/xml
    </FilesMatch>

    ErrorLog /var/log/apache2/rcm_provisioning_8091_error.log
    CustomLog /var/lib/rcm/dex/provisioning_http_access.log combined
</VirtualHost>
